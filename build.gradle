plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.darkhax.curseforgegradle' version '1.1.18'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id,
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// -----------------------------------------------------------------------------
// Modrinth publishing — only wired up when MODRINTH_TOKEN is present.
// Trigger with `./gradlew modrinth` in CI once the tag job sets the env vars.
// -----------------------------------------------------------------------------
if (System.getenv('MODRINTH_TOKEN')) {
    modrinth {
        token = System.getenv('MODRINTH_TOKEN')
        projectId = modrinth_project_id
        versionNumber = project.version
        versionType = (project.version.toString().contains('-') ? 'beta' : 'release')
        uploadFile = tasks.named('jar')
        gameVersions = [minecraft_version]
        loaders = ['forge']
        syncBodyFrom = file('README.md').exists() ? file('README.md').text : null
    }
    tasks.named('modrinth').configure { dependsOn tasks.named('build') }
}

// -----------------------------------------------------------------------------
// CurseForge publishing — only wired up when CURSEFORGE_TOKEN is present.
// Uses Darkhax's curseforgegradle plugin. Trigger with `./gradlew publishCurseForge`.
// -----------------------------------------------------------------------------
if (System.getenv('CURSEFORGE_TOKEN')) {
    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        dependsOn tasks.named('build')
        apiToken = System.getenv('CURSEFORGE_TOKEN')

        def mainFile = upload(curseforge_project_id, tasks.named('jar').get().archiveFile)
        mainFile.releaseType = (project.version.toString().contains('-') ? 'beta' : 'release')
        mainFile.addGameVersion(minecraft_version)
        mainFile.addModLoader('Forge')
        mainFile.changelog = "Release ${project.version}"
        mainFile.changelogType = 'markdown'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('jar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
