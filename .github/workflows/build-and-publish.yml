name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `git rev-parse v$VERSION` can see existing tags.
          fetch-depth: 0

      - name: Read mod_version from gradle.properties
        id: version
        run: |
          VERSION=$(grep -m1 '^mod_version' gradle.properties \
                      | sed -E 's/mod_version[[:space:]]*=[[:space:]]*//' \
                      | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected mod_version: $VERSION"

          # Only main pushes are candidates for release. PRs and manual runs just build.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists — skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$VERSION is new — will release."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: offhandtweaks-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: v${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mod jar artifact
        uses: actions/download-artifact@v4
        with:
          name: offhandtweaks-jar
          path: build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Offhand Tweaks v${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            ### Downloads
            | File | Description |
            |------|-------------|
            | `offhandtweaks-${{ needs.build.outputs.version }}.jar` | Forge 1.20.1 mod jar |

            See the [README](https://github.com/${{ github.repository }}#offhand-tweaks) for configuration details.
          files: build/libs/*.jar

  publish:
    name: Publish to Modrinth and CurseForge
    needs: [build, release]
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build for publish
        run: ./gradlew --no-daemon build

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew --no-daemon modrinth

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew --no-daemon publishCurseForge
